# Production specific docker-compose override
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
    restart: always
    volumes:
      - ./backend/public/images:/app/public/images:ro
      - db_data:/app/data

  frontend:
    build:
      context: ./frontend/src
      dockerfile: Dockerfile.prod
    environment:
      - REACT_APP_API_URL=http://backend:3001
    restart: always

  nginx:
    image: nginx:alpine
    container_name: inshokuten_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - inshokuten_network
    restart: always