version: '3.8'

services:
  # Backend Service (Node.js API Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inshokuten_backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/public/images:/app/public/images
    environment:
      - NODE_ENV=development
      - PORT=3001
    networks:
      - inshokuten_network
    restart: unless-stopped
    depends_on:
      - db_init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service (React Development Server)
  frontend:
    build:
      context: ./frontend/src
      dockerfile: Dockerfile
    container_name: inshokuten_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - inshokuten_network
    restart: unless-stopped
    depends_on:
      - backend
    stdin_open: true
    tty: true

  # Database Initialization Service
  db_init:
    build:
      context: ./backend
      dockerfile: Dockerfile.db
    container_name: inshokuten_db_init
    volumes:
      - ./backend:/app
      - db_data:/app/data
    networks:
      - inshokuten_network
    command: ["node", "-e", "console.log('Database initialized')"]

  # Database Volume Management
  db_backup:
    image: alpine:latest
    container_name: inshokuten_db_backup
    volumes:
      - db_data:/data
      - ./backups:/backups
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - inshokuten_network

volumes:
  db_data:
    driver: local
  node_modules_backend:
    driver: local
  node_modules_frontend:
    driver: local

networks:
  inshokuten_network:
    driver: bridge